<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A simple countdown timer.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">
  <title>计时器</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="timer-app">
    <section class="timer-face" aria-live="polite">
      <div class="picker" id="picker">
        <label><input id="hours" type="number" min="0" max="23" value="0" inputmode="numeric" aria-label="小时"><span>小时</span></label>
        <label><input id="minutes" type="number" min="0" max="59" value="12" inputmode="numeric" aria-label="分钟"><span>分钟</span></label>
        <label><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="秒"><span>秒</span></label>
      </div>

      <div class="countdown" id="countdown" hidden>
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle class="track" cx="150" cy="150" r="140"></circle>
          <circle class="progress" id="progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-copy">
          <span class="remaining" id="remaining">12:00</span>
          <span class="status" id="status">倒计时</span>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="计时控制">
      <button class="round-button secondary" id="cancelButton" type="button" disabled><span>取消</span></button>
      <button class="round-button primary" id="startButton" type="button"><span id="startLabel">开始</span></button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
